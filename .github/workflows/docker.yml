name: "Publish Server Container Image"
on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发

permissions:
  contents: read
  packages: write # 必须授权以推送镜像

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Vars
        run: |
          LOWER_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_NAME=$LOWER_NAME" >> $GITHUB_ENV
          echo "CONTAINER_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (Dockerfile.DIY)
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.DIY
          context: .
          platforms: linux/amd64 #,linux/arm64 # 指定架构：x86_64 和 ARM64
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_NAME }}:latest
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.CONTAINER_NAME }}
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'
